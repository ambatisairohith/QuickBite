<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite - Nearby Restaurants</title>
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        #map {
            height: 500px;
            width: 100%;
            border-radius: 15px;
            margin-top: 20px;
        }
        .map-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .map-container h2 {
            color: #ff4500;
            font-size: 26px;
            margin-bottom: 10px;
        }
        .map-container p {
            color: #555;
            margin-bottom: 15px;
        }
        .restaurant-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }
        .restaurant-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .restaurant-card:hover {
            transform: translateY(-5px);
            border: 2px solid #ff4500;
        }
        .restaurant-card h4 {
            color: #ff4500;
            margin-bottom: 8px;
        }
        .restaurant-card p {
            font-size: 13px;
            color: #777;
            margin: 3px 0;
        }
        .locate-btn {
            padding: 12px 25px;
            background: #ff4500;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .locate-btn:hover {
            background: #cc3700;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">⚡ QuickBite</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <!-- Map Container -->
    <div class="map-container">
        <h2>📍 Nearby Restaurants</h2>
        <p>Find the best restaurants near you!</p>

        <button class="locate-btn" onclick="locateMe()">
            📍 Find Restaurants Near Me
        </button>

        <!-- Map -->
        <div id="map"></div>

        <!-- Restaurant List -->
        <div class="restaurant-list" id="restaurantList"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="map.js"></script>
</body>
</html>
